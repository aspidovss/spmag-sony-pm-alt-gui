# docker compose up -d
services:
  spmag-wpr:
    build: .
    container_name: spmag-wpr
    network_mode: host          # required for SSDP camera discovery
    restart: unless-stopped
    volumes:
      - /srv/photos/camera:/photos
      - ./config:/config        # settings.json (pairing ID) and received.json
    # extra options are appended to "wpr watch -dest /photos", e.g.:
    # command: ["-types", "jpeg,raw", "-guid", "00:00:00:00:00:00:00:00:ff:ff:..."]

name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  GOFLAGS: -mod=mod
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./internal/...
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" bash ./build.sh
      - name: Package
        run: |
          v="${GITHUB_REF_NAME}"
          win="SPMAG-WifiPhotoReceiver-$v-windows-amd64"
          mkdir "$win" && cp dist/*.exe dist/README.md dist/LICENSE "$win"/
          zip -r "$win.zip" "$win"
          for arch in amd64 arm64; do
            lin="SPMAG-wpr-$v-linux-$arch"
            cp -r "dist/linux-$arch" "$lin"
            tar -czf "$lin.tar.gz" "$lin"
          done
          cp dist/spmag-wpr_*.deb .
          for arch in amd64 arm64; do
            cp "dist/SPMAG-wpr-${v#v}-linux-$arch.AppImage" "SPMAG-wpr-$v-linux-$arch.AppImage"
          done
          sha256sum SPMAG-*.zip SPMAG-*.tar.gz SPMAG-*.AppImage spmag-wpr_*.deb > SHA256SUMS.txt
          # release notes: only this version's section of the changelog
          awk -v v="${v#v}" '/^## /{p = ($2 == v || $2 == "v" v)} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || cp CHANGELOG.md release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            SPMAG-*.zip
            SPMAG-*.tar.gz
            SPMAG-*.AppImage
            spmag-wpr_*.deb
            SHA256SUMS.txt
          body_path: release-notes.md

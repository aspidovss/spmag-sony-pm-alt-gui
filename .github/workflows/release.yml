name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  GOFLAGS: -mod=mod
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./internal/...
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Package
        run: |
          name="SPMAG-WifiPhotoReceiver-${GITHUB_REF_NAME}-windows-amd64"
          mkdir "$name" && cp dist/* "$name"/
          zip -r "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SPMAG-WifiPhotoReceiver-*.zip
            SPMAG-WifiPhotoReceiver-*.zip.sha256
          body_path: CHANGELOG.md

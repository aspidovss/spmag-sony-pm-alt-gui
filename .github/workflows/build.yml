name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  GOFLAGS: -mod=mod
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Test
        run: go test -race ./internal/...
      - name: Vet (Windows)
        run: GOOS=windows go vet ./...
      - name: Build
        run: bash ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: SPMAG-WifiPhotoReceiver-builds
          path: dist/

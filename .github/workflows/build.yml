name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  GOFLAGS: -mod=mod
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test -race ./internal/...
      - name: Vet (Windows)
        run: GOOS=windows go vet ./...
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SPMAG-WifiPhotoReceiver-windows-amd64
          path: dist/

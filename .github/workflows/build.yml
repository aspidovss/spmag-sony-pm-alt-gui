name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  GOFLAGS: -mod=mod
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Test
        run: go test -race ./internal/...
      - name: Known vulnerabilities (govulncheck, informational)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Vet (Windows)
        run: GOOS=windows go vet ./...
      - name: Build
        run: bash ./build.sh
      - name: Smoke test the AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1 SPMAG_CONFIG_DIR="$RUNNER_TEMP/cfg"
          dist/SPMAG-wpr-*-linux-amd64.AppImage guid
      - uses: actions/upload-artifact@v7
        with:
          name: SPMAG-WifiPhotoReceiver-builds
          path: dist/
